<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./form.css">
    <link rel="stylesheet" href="../css/models/waves.css">
    <link rel="stylesheet" href="../css/models/bolinhas.css">
    <title>Resetar Senha</title>
</head>
<body>
    <div class="rastros">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <main>
        <div class="form-card">
            <h1>Resete sua <span>senha</span></h1>

            <form id="resetar-senha-form">
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>
                <div class="campo">
                    <label for="confirmar-senha">Confirmar Senha</label>
                    <input type="password" id="confirmar-senha" placeholder="Confirme sua senha" required> 
                </div>

                <button type="submit" class="btn-hero">Enviar</button>
                <p class="confirmar">Defina uma nova senha para sua conta. <a href="../index.html">Página Inicial</a></p>
                <p class="mensagem-erro" id="mensagemDeErro"></p>
            </form>
        </div>
    </main>
    <script type="module" src="resetar-senha.js"></script>
</body>
</html>
