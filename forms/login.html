<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="form.css">
</head>

<body>

        <div class="form-card">

            <h1>Bem-vindo <span>de volta!</span></h1>

            <p class="textinho">Entre na sua conta para continuar.</p>

            <form id="login-form">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit">Entrar</button>

                <p id="mensagemDeErro"></p>

            </form>

            <p class="confirmar">Ainda não tem uma conta? <a href="cadastro.html">Criar conta</a></p>

        </div>

    <script type="module" src="scripts/logar.js"></script>

</body>
</html>
